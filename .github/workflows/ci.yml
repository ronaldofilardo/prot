name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    # Valores dummy apenas para typecheck/build em CI (nenhum valor real aqui).
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/prot?schema=public"
      NEXTAUTH_SECRET: "ci-dummy-nextauth-secret"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx prisma generate

      - run: pnpm test:coverage

      - run: pnpm lint

      - run: npx tsc --noEmit

      - run: npx next build
